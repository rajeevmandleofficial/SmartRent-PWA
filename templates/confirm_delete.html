{% extends 'base.html' %}

{% block title %}Confirm Delete | SmartRent{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="bg-white dark:bg-slate-900 p-8 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-xl text-center space-y-6">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-rose-50 dark:bg-rose-950/60 text-rose-600 flex items-center justify-center text-2xl shadow-inner">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>

        <div>
            <h1 class="text-xl font-extrabold text-slate-900 dark:text-white">
                Delete {{ type }}?
            </h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-2">
                Kya aap sach me <b>{{ object }}</b> ko delete karna chahte hain? Yeh action revert nahi kiya ja sakta.
            </p>
        </div>

        <form method="post" class="flex items-center justify-center gap-3 pt-2">
            {% csrf_token %}
            <a href="javascript:history.back()" class="px-5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                Cancel
            </a>
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold shadow-md shadow-rose-600/20 active:scale-95 transition-all">
                Yes, Delete
            </button>
        </form>
    </div>
</div>
{% endblock %}
